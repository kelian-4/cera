name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, test & lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer la toolchain Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      - name: Cache des dependances Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Verifier le formatage
        id: fmt
        run: cargo fmt --check 2>&1 | tee fmt.log

      - name: Lint avec clippy
        id: clippy
        if: always() && steps.fmt.outcome != 'cancelled'
        run: cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log

      - name: Build
        id: build
        if: always() && steps.fmt.outcome != 'cancelled'
        run: cargo build --verbose 2>&1 | tee build.log

      - name: Lancer les tests
        id: tests
        if: always() && steps.fmt.outcome != 'cancelled'
        run: cargo test --verbose 2>&1 | tee test.log

      - name: Notifier en cas d'echec
        if: failure()
        run: |
          curl -d "CI en echec sur cera (${{ github.ref_name }}) - commit ${{ github.sha }}" ntfy.sh/TON_TOPIC_PERSO

      - name: Ecrire le log de statut
        if: always()
        run: |
          {
            echo "# CI Status"
            echo ""
            echo "Commit: ${{ github.sha }}"
            echo "Branche: ${{ github.ref_name }}"
            echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "| Etape | Resultat |"
            echo "|---|---|"
            echo "| Formatage (fmt) | ${{ steps.fmt.outcome }} |"
            echo "| Clippy | ${{ steps.clippy.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo "| Tests | ${{ steps.tests.outcome }} |"
            echo ""
            echo "## Log complet - Formatage (fmt)"
            echo '```'
            cat fmt.log 2>/dev/null || echo "(pas de log)"
            echo '```'
            echo ""
            echo "## Log complet - Clippy"
            echo '```'
            cat clippy.log 2>/dev/null || echo "(pas de log)"
            echo '```'
            echo ""
            echo "## Log complet - Build"
            echo '```'
            cat build.log 2>/dev/null || echo "(pas de log)"
            echo '```'
            echo ""
            echo "## Log complet - Tests"
            echo '```'
            cat test.log 2>/dev/null || echo "(pas de log)"
            echo '```'
          } > ci-status.md
          rm -f fmt.log clippy.log build.log test.log

      - name: Commit et push le log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-status.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: mise a jour ci-status.md [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

